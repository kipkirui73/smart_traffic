<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1 class="mb-4">🚦 Smart Traffic Violation Dashboard</h1>
    <p>Total Violations: <strong>{{ violations|length }}</strong></p>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Vehicle ID</th>
                <th>Time</th>
                <th>Evidence</th>
            </tr>
        </thead>
        <tbody>
            {% for v in violations %}
            <tr>
                <td>{{ v[0] }}</td>
                <td>{{ v[1] }}</td>
                <td>{{ v[2] }}</td>
                <td><a href="/static/{{ v[3].split('/')[-1] }}" target="_blank">View Image</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
